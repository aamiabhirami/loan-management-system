<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b33">
    <title>Mitra is offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f8faf8; color: #24463a; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 28rem; padding: 2rem; border: 1px solid #dfe9e2; border-radius: 1rem; background: white; text-align: center; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 1rem 0 0; color: #60776c; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Mitra needs an internet connection to sign in and access records. Reconnect, then reload the app. Private customer and loan data is not stored for offline use.</p>
    </main>
  </body>
</html>
